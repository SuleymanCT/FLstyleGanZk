# İspat takvimi ve kabul eşikleri. Faz D (orchestrator/schedule.py,
# orchestrator/aggregate.py, contracts/RoundManager.sol) bu dosyayı okur.

proof_schedule:
  # fixed_rounds: her zaman TAM ispat istenecek round numaraları (o
  # round'da random_ratio/itibar durumundan BAĞIMSIZ, HER site ispat
  # üretir). 0 (baz model sonrası ilk round), 7 (orta nokta) ve 14
  # (son round, Faz A'nın tamamlandığı deney bu kadar sürdü) seçildi —
  # deneyin başı/ortası/sonu her zaman tam denetimli.
  fixed_rounds: [0, 7, 14]
  # random_ratio: sabit turlar DIŞINDA, her (round,site) çiftinin ispat
  # üretmesi için deterministik-rastgele seçilme olasılığı. 0.3 seçildi:
  # her site'ı her round'da ispatlamak (Faz C3 ölçümüyle ~37s prove +
  # ~37s setup + gerçek zincir gas'ı) 15 round × birden fazla site için
  # ciddi bir toplam maliyet biriktirir; %30 örnekleme, sabotajı
  # (itibar mekanizmasıyla birlikte) caydırmaya yetecek kadar sık
  # denetim + kabul edilebilir toplam ispat sayısı arasında bir denge.
  # "full" modu (mode="full", orchestrator/schedule.py:must_prove) bu
  # oranı YOKSAYIP HER round HER site'ı ispatlar — makalenin karşılaştırma
  # tabanı (örnekleme YOKKEN maliyet ne olurdu).
  random_ratio: 0.3
  # reputation_threshold: bu eşiğin ALTINA düşen site (a) sonraki
  # turlarda ZORUNLU ispat üretir (random_ratio'dan bağımsız) VE (b)
  # RoundManager.sol: isSiteEligible false döner (finalizeRound'a dahil
  # edilemez). reputation_initial'ın (100) yarısı seçildi: iki başarısız
  # ispat (penalty=20 her biri) siteyi bu eşiğin altına düşürür.
  reputation_threshold: 50

# reputation_initial: her yeni registerSite çağrısında sitenin başlangıç
# itibarı. round_id/site sayısından bağımsız sabit bir protokol
# parametresi — 0-100 ölçeğinde "tam güven" ile başlanıyor.
reputation_initial: 100

# reputation_penalty: geçersiz bir ispat (submitProof False) sonrası
# itibardan düşülecek miktar. 20 seçildi: reputation_threshold (50) ile
# birlikte İKİ ardışık başarısız ispat siteyi eşiğin altına düşürür
# (100 -> 80 -> 60 -> 40), üçüncüsünden SONRA değil ikincisinden SONRA
# zorunlu-denetim moduna girer — tek seferlik bir hata (ağ sorunu,
# geçici bozuk snapshot) hemen dışlamaya yol açmasın ama tekrarlayan
# başarısızlık hızlı yakalansın.
reputation_penalty: 20

# reputation_bonus: geçerli bir ispat (submitProof True) sonrası
# itibara eklenecek miktar. 1 seçildi (ceza 20'nin çok altında) —
# itibarın hızlı DÜŞMESİ ama yavaş TOPLANMASI isteniyor: bir kez
# şüpheli davranan site kolayca "temize çıkmamalı", uzun süreli
# tutarlı doğru davranışla kademeli güven kazanmalı.
reputation_bonus: 1

# tau_norm_threshold: ΔG normunun bu değeri aşması sabotaj şüphesi
# sayılır. delta-G p99=2518 (n=56, Faz A ölçümü); tau bunun ~1.2 katı
# seçildi ki normal eğitimde clipping devreye girmesin, ama ölçekli
# zehirleme saldırıları yakalansın.
tau_norm_threshold: 3000.0

# replay_infra: SADECE scripts/replay_proofs.py'nin anvil ömür-döngüsü
# yönetimi için — protokolün KENDİSİYLE (reputation/schedule) ilgisi
# yok. Faz E'nin gerçek Colab koşumunda anvil 36 ispat sonrası (her biri
# kendi verifier deploy'u + ispat calldata'sı biriktiriyor) RPC
# isteklerine yanıt vermez oldu (`ReadTimeout`, 30s varsayılan timeout).
replay_infra:
  # anvil_restart_interval: kaç GERÇEKLEŞEN ispattan sonra anvil TAMAMEN
  # yeniden başlatılıp RoundManager yeniden deploy edilsin. 10 seçildi:
  # 36 ispatta sorun çıktığından, sınırı çok daha erken (3-4x marj) koyup
  # anvil'in ASLA bu kadar şişmesine izin vermemek. `--prune-history` tek
  # başına yeterli OLMAYABİLİR (foundry-rs/foundry#6017) — bu yüzden
  # düzenli TAM yeniden başlatma birincil savunma.
  anvil_restart_interval: 10
  # rpc_timeout_seconds: web3.py'nin HTTP RPC istek zaman aşımı. Eski
  # varsayılan (web3.py'nin kendisi, 30s) tam gözlenen hatanın kaynağıydı
  # ("Read timed out. (read timeout=30.0)") — anvil ağırlaştıkça bazı
  # RPC çağrıları (özellikle ispat calldata'sı biriktikçe) 30s'yi
  # aşabiliyor. 120s'ye çıkarıldı (chain/client.py: DEFAULT_RPC_TIMEOUT_SECONDS
  # ile de tutarlı — o TÜM Web3Client kullanıcıları için varsayılan oldu).
  rpc_timeout_seconds: 120.0
  # health_check_timeout_seconds: her round/ispat öncesi yapılan basit
  # `eth_blockNumber` sağlık kontrolünün zaman aşımı — rpc_timeout_seconds'tan
  # BİLEREK KISA (asıl amaç "yanıt veriyor mu" diye HIZLI bakmak, cevap
  # gelene kadar uzun uzun beklemek DEĞİL).
  health_check_timeout_seconds: 5.0
