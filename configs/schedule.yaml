# İspat takvimi ve kabul eşikleri.

proof_schedule:
  # fixed_rounds: her zaman tam ispat istenecek round numaraları (ör. [0, 7, 14]).
  fixed_rounds: []
  # random_ratio: sabit turlar dışında, rastgele seçilecek site/round
  # oranı (0.0-1.0). Kademeli modda kullanılır.
  random_ratio: null
  # reputation_threshold: bu eşiğin altına düşen site sonraki turlarda dışlanır.
  reputation_threshold: null

# tau_norm_threshold: ΔG normunun bu değeri aşması sabotaj şüphesi
# sayılır. delta-G p99=2518 (n=56, Faz A ölçümü); tau bunun ~1.2 katı
# seçildi ki normal eğitimde clipping devreye girmesin, ama ölçekli
# zehirleme saldırıları yakalansın.
tau_norm_threshold: 3000.0
